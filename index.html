<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Side Quest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet" />
  <style>
    :root { --ink: #e9e2cf; --dim: rgba(233, 226, 207, 0.55); --line: rgba(233, 226, 207, 0.35); }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: var(--ink); font-family: "Cinzel", serif; }
    canvas { width: 100%; height: 100%; display: block; outline: none; }
    .hidden { opacity: 0 !important; pointer-events: none !important; }

    /* bussola */
    #compass { position: fixed; top: 22px; left: 50%; transform: translateX(-50%); width: min(560px, 70vw); height: 34px; pointer-events: none; transition: opacity .4s; }
    #compass::before { content: ""; position: absolute; inset: 9px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
      background: linear-gradient(90deg, transparent, rgba(0,0,0,.35) 15%, rgba(0,0,0,.35) 85%, transparent);
      -webkit-mask: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent); mask: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent); }
    #compass-strip { position: absolute; inset: 0; }
    #compass-strip > * { position: absolute; top: 50%; transform: translate(-50%, -50%); text-shadow: 0 0 6px #000; }
    .c-main { font-size: 15px; font-weight: 600; letter-spacing: .05em; }
    .c-sub { font-size: 10px; color: var(--dim); }
    .c-tick { width: 1px; height: 7px; background: var(--dim); }
    .c-quest { width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 10px solid #d9b45a; top: 30% !important;
      filter: drop-shadow(0 0 3px #000); }

    /* barre */
    .bar { position: fixed; bottom: 34px; width: min(260px, 26vw); height: 12px; pointer-events: none; transition: opacity .6s; }
    .bar::before { content: ""; position: absolute; inset: 0 -14px; border: 1px solid var(--line); border-radius: 2px;
      background: rgba(0,0,0,.45); clip-path: polygon(0 50%, 14px 0, calc(100% - 14px) 0, 100% 50%, calc(100% - 14px) 100%, 14px 100%); }
    .bar > div { position: absolute; inset: 3px 0; margin: auto; transition: width .12s linear; }
    #health-wrap { left: 50%; transform: translateX(-50%); }
    #magicka-wrap { left: 6vw; }
    #stamina-wrap { right: 6vw; }
    #bar-health { width: 100%; background: linear-gradient(#c8463a, #7a1d16); }
    #bar-magicka { width: 100%; background: linear-gradient(#4f86c9, #1d3f76); }
    #bar-stamina { width: 100%; background: linear-gradient(#6fae5a, #2b5a23); }
    #health-wrap, #magicka-wrap { opacity: 0; }  /* piene: nascoste, come in Skyrim */
    #stamina-wrap.flash > div { animation: flash .5s 2; }
    @keyframes flash { 50% { filter: brightness(2.2); } }

    #crosshair { position: fixed; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px; border-radius: 50%; background: var(--ink); opacity: .7; box-shadow: 0 0 3px #000; pointer-events: none; }
    body.paused #crosshair, body.paused #compass { opacity: 0; }

    /* overlay */
    #overlay, #loading { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; transition: opacity .6s;
      background: radial-gradient(ellipse at center, rgba(0,0,0,.25), rgba(0,0,0,.8)); cursor: pointer; }
    #loading { background: #0b0a08; cursor: default; }
    #overlay > div { max-height: 100vh; overflow-y: auto; padding: 24px 16px; }
    h1 { font-size: clamp(36px, min(7vw, 9vh), 96px); font-weight: 700; letter-spacing: .16em; margin: 0; text-shadow: 0 2px 24px #000; }
    h1 + p { font-family: "Cormorant Garamond", serif; font-style: italic; font-size: 22px; color: var(--dim); margin: 6px 0 36px; }
    .rule { width: 260px; height: 1px; margin: 0 auto 28px; background: linear-gradient(90deg, transparent, var(--line), transparent); }
    .keys { display: grid; grid-template-columns: auto auto; gap: 8px 22px; justify-content: center; font-size: 13px; letter-spacing: .08em; text-align: left; }
    .keys b { color: #d9b45a; font-weight: 600; text-align: right; }
    .go { margin-top: 34px; font-size: 14px; letter-spacing: .3em; animation: pulse 2.4s ease-in-out infinite; }
    #graphics-title { font-size: 13px; letter-spacing: .3em; color: #d9b45a; margin-bottom: 12px; text-transform: uppercase; }
    #graphics { display: grid; gap: 7px; width: min(560px, 92vw); margin: 0 auto; cursor: default; }
    .g-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; font-size: 12px; letter-spacing: .08em; }
    .g-row > div { display: flex; gap: 4px; }
    .g-row button { font: inherit; font-size: 11px; color: var(--dim); background: rgba(0,0,0,.4); border: 1px solid var(--line); padding: 4px 9px; cursor: pointer; }
    .g-row button:hover { color: var(--ink); }
    .g-row button.on { color: #120d06; background: #d9b45a; border-color: #d9b45a; }
    @keyframes pulse { 50% { opacity: .45; } }
  </style>
</head>
<body class="paused">
  <canvas id="game"></canvas>
  <div id="compass"><div id="compass-strip"></div></div>
  <div id="crosshair"></div>
  <div class="bar" id="magicka-wrap"><div id="bar-magicka"></div></div>
  <div class="bar" id="health-wrap"><div id="bar-health"></div></div>
  <div class="bar hidden" id="stamina-wrap"><div id="bar-stamina"></div></div>
  <div id="overlay" class="hidden">
    <div>
      <h1>SIDE QUEST</h1>
      <p>Il bosco delle pietre erette</p>
      <div class="rule"></div>
      <div class="keys">
        <b>WASD</b><span>Muoversi</span>
        <b>Shift</b><span>Correre</span>
        <b>Spazio</b><span>Saltare</span>
        <b>Click sinistro</b><span>Attaccare</span>
        <b>Click destro</b><span>Parare con lo scudo</span>
        <b>Esc</b><span>Pausa</span>
      </div>
      <div class="go">CLICCA PER GIOCARE</div>
      <div class="rule" style="margin-top:30px"></div>
      <div id="graphics-title">Grafica</div>
      <div id="graphics"></div>
    </div>
  </div>
  <div id="loading"><div><h1>SIDE QUEST</h1><p>Il bosco cresce…</p></div></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
